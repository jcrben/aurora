name: Latest Images
on:
  # jcrben replica (2026-09-11): dropped upstream's push/pull_request/
  # merge_group auto-triggers on stable-f44 — on-demand only, see
  # trigger-schedule-stable-image.yml for the rationale.
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build-image-latest:
    name: Build Latest Images
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    with:
      image_flavors: '["main", "nvidia-open"]'
      stream_name: latest
      # FIXME: MAIN has no arm builds in ublue-os/akmods yet
      # https://github.com/ublue-os/akmods/pull/440
      # architecture: '["aarch64","x86_64"]'
      architecture: '["x86_64"]'
      publish: ${{ github.event_name != 'pull_request' }}

  generate-release:
    name: Generate Release
    needs: [build-image-latest]
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      stream_name: '["latest"]'
