# We have this because we can't schedule builds on non-default branches
#
# jcrben replica (2026-09-11): upstream's weekly cron removed on purpose —
# this fork builds on demand only (workflow_dispatch), to be considerate of
# GitHub's public-repo Actions minutes rather than auto-building weekly like
# ublue-os/aurora does. Trigger a real build manually from the Actions tab
# ("Trigger Stable Image Build" -> Run workflow) when you actually want one.
name: Trigger Stable Image Build
on:
  workflow_dispatch:

permissions: {}

jobs:
  trigger-stable-build:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trigger Stable Image Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: stable-f44
        run: |
          gh workflow run \
            build-image-stable.yml \
            --ref "${BRANCH}"
