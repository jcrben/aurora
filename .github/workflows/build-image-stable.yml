name: Stable Images
on:
  # jcrben replica (2026-09-11): dropped the upstream pull_request CI-only
  # trigger too — this fork isn't accepting external PRs, and even a
  # non-publishing validation run still spends Actions minutes. workflow_call
  # (from trigger-schedule-stable-image.yml's manual dispatch) and
  # workflow_dispatch (direct manual run) are the only ways in.
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build-image-stable:
    name: Build Stable Images
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    with:
      stream_name: stable
      # Enable ARM when it makes sense
      # architecture: '["aarch64","x86_64"]'
      architecture: '["x86_64"]'
      publish: ${{ github.event_name != 'pull_request' }}

  generate-release:
    name: Generate Release
    needs: [build-image-stable]
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      stream_name: '["stable"]'
